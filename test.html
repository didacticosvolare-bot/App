<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test</title>
  <style>
    body {
      background: #F7F1E1;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: white;
      border: 3px solid #4A6741;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      max-width: 500px;
    }
    h1 {
      color: #4A6741;
      font-size: 32px;
      margin: 0 0 20px 0;
    }
    p {
      color: #2B2118;
      font-size: 18px;
      margin: 10px 0;
    }
    .success {
      background: #dcfce7;
      color: #166534;
      padding: 10px;
      border-radius: 5px;
      margin: 10px 0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✅ Los Tradicionales</h1>
    <p>¡El servidor está funcionando!</p>
    <div class="success">React se cargará en breve...</div>
  </div>

</html>
